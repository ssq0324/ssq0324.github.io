        }
        .player-container {

        }

            background: linear-gradient(135deg, #667eea, #764ba2);

            text-align: center;
            padding: 15px 10px;
            font-size: 18px;
            flex-shrink: 0;
        }
        .left-panel {
            order: 2; /* 竖屏时在下面 */
            padding: 20px;
            background: #fff;
            border-top: 1px solid #eee;
            flex-shrink: 0;
        }
        .right-panel {
            order: 1; /* 竖屏时在上面 */
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #f9f9f9;
        }
        .playlist-title {
            font-size: 16px;
            color: #333;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .song-info {
            text-align: center;
            margin-bottom: 12px;
        }
        .song-name {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .artist-name {
            font-size: 12px;
            color: #888;
        }
        .progress-container {
            margin-bottom: 8px;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }
        .progress {
            height: 100%;
            background: linear-gradient(to right, #667eea, #764ba2);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s;
        }
        .time {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #888;
            margin-top: 4px;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 15px 0;
        }
        .btn {
            border: none;
            background: none;
            cursor: pointer;
            font-size: 22px;
            color: #555;
            transition: all 0.3s;
            padding: 8px;
            border-radius: 50%;
        }
        .btn:hover {
            color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }
        .btn-play {
            font-size: 32px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn-play:hover {
            transform: scale(1.1);
            color: white;
            background: linear-gradient(135deg, #5a67d8, #6b46c1);
        }
        .mode-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .mode-btn {
            border: 2px solid #ddd;
            background: white;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
            color: #555;
        }
        .mode-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        .timer-section {
            border-top: 1px solid #eee;
            padding-top: 15px;
            text-align: center;
        }
        .timer-section label {
            font-size: 13px;
            color: #555;
        }
        .timer-select {
            margin-left: 8px;
            padding: 4px 8px;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-size: 13px;
        }
        .timer-btn {
            margin-left: 8px;
            padding: 5px 12px;
            border: none;
            background: #667eea;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;

            background: #5a67d8;

            font-size: 12px;
            color: #888;
            margin-top: 8px;
            min-height: 18px;
        }
        .playlist {
            max-height: none;
            overflow-y: visible;
        }
        .playlist-item {
            padding: 10px;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.2s;
            font-size: 13px;
            color: #555;
            white-space: nowrap;

            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
            font-weight: bold;

                font-size: 20px;
                padding: 15px;
                border-radius: 20px 20px 0 0;

            .left-panel {

                width: 380px;
                height: calc(85vh - 60px);

                border-right: 1px solid #eee;
                overflow-y: auto;
            }
            .right-panel {
                order: 2;
                width: calc(100% - 380px);

            }

<body>
    <div class="player-container">
        <h2 class="main-title">🎵 在线音乐播放器</h2>
        
        <!-- 左侧/底部：控制面板 -->
        <div class="left-panel">
            <div class="song-info">
                <div class="song-name" id="songName">选择一首歌曲</div>
                <div class="artist-name" id="artistName">未知艺术家</div>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progressBar">
                    <div class="progress" id="progress"></div>
                </div>
                <div class="time">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button class="btn" id="prevBtn" title="上一首">⏮</button>
                <button class="btn btn-play" id="playBtn" title="播放/暂停">▶</button>
                <button class="btn" id="nextBtn" title="下一首">⏭</button>
            </div>

            <div class="mode-controls">
                <button class="mode-btn active" id="modeOrder" onclick="setMode('order')">📋 顺序播放</button>
                <button class="mode-btn" id="modeRandom" onclick="setMode('random')">🔀 随机播放</button>
                <button class="mode-btn" id="modeLoop" onclick="setMode('loop')">🔁 单曲循环</button>
            </div>

            <div class="timer-section">
                <label>⏰ 定时关闭：</label>
                <select class="timer-select" id="timerSelect">
                    <option value="0">不开启</option>
                    <option value="10">10分钟</option>
                    <option value="20">20分钟</option>
                    <option value="30">30分钟</option>
                    <option value="60">60分钟</option>
                    <option value="custom">自定义...</option>
                </select>
                <button class="timer-btn" id="timerBtn" onclick="setTimer()">确定</button>
                <div class="timer-display" id="timerDisplay"></div>
            </div>

            <audio id="audio"></audio>
        </div>

        <!-- 右侧/顶部：播放列表 -->
        <div class="right-panel">
            <div class="playlist-title">🎶 播放列表（共 <span id="songCount"></span> 首）</div>
            <div class="playlist" id="playlist"></div>
        </div>
    </div>

        let currentSongIndex = 0;
        let isPlaying = false;
        let currentMode = 'order';
        let timerId = null;
        let timerEndTime = null;

        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('playBtn');
        const songNameEl = document.getElementById('songName');
        const artistNameEl = document.getElementById('artistName');
        const progress = document.getElementById('progress');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const playlistEl = document.getElementById('playlist');
        const timerDisplay = document.getElementById('timerDisplay');

        function initPlaylist() {
            playlistEl.innerHTML = '';
            songs.forEach((song, index) => {
                const div = document.createElement('div');
                div.className = 'playlist-item';
                div.innerHTML = `${index + 1}. ${song.name}`;
                div.onclick = () => loadSong(index);
                playlistEl.appendChild(div);
            });
            document.getElementById('songCount').textContent = songs.length;
        }

        function loadSong(index) {
            currentSongIndex = index;
            const song = songs[index];
            audio.src = song.url;
            songNameEl.textContent = song.name;
            artistNameEl.textContent = song.artist || '未知艺术家';
            
            document.querySelectorAll('.playlist-item').forEach((item, i) => {
                item.classList.toggle('playing', i === index);
            });
            
            if (isPlaying) {
                audio.play();
            }
        }

        function togglePlay() {
            if (!audio.src) {
                loadSong(0);
            }
            if (isPlaying) {
                audio.pause();
                playBtn.textContent = '▶';
            } else {
                audio.play();
                playBtn.textContent = '⏸';
            }
            isPlaying = !isPlaying;
        }

        function prevSong() {
            let index;
            if (currentMode === 'random') {
                index = Math.floor(Math.random() * songs.length);
            } else {
                index = currentSongIndex > 0 ? currentSongIndex - 1 : songs.length - 1;
            }
            loadSong(index);
            if (isPlaying) audio.play();
        }

        function nextSong() {
            if (currentMode === 'random') {
                let index = Math.floor(Math.random() * songs.length);
                while (index === currentSongIndex && songs.length > 1) {
                    index = Math.floor(Math.random() * songs.length);
                }
                loadSong(index);
            } else {
                let index = currentSongIndex < songs.length - 1 ? currentSongIndex + 1 : 0;
                loadSong(index);
            }
            if (isPlaying) audio.play();
        }

        function setMode(mode) {
            currentMode = mode;
            audio.loop = (mode === 'loop');
            
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            if (mode === 'order') document.getElementById('modeOrder').classList.add('active');
            if (mode === 'random') document.getElementById('modeRandom').classList.add('active');
            if (mode === 'loop') document.getElementById('modeLoop').classList.add('active');
        }

        function setTimer() {
            const select = document.getElementById('timerSelect');
            let minutes = parseInt(select.value);
            
            if (select.value === 'custom') {
                minutes = parseInt(prompt('请输入定时关闭的分钟数：'));
                if (isNaN(minutes) || minutes <= 0) return;
            }
            
            if (minutes === 0) {
                clearTimer();
                return;
            }
            
            clearTimer();
            
            const ms = minutes * 60 * 1000;
            timerEndTime = Date.now() + ms;
            
            timerId = setTimeout(() => {
                audio.pause();
                isPlaying = false;
                playBtn.textContent = '▶';
                alert('⏰ 定时关闭时间到，音乐已停止播放！');
                timerDisplay.textContent = '';
            }, ms);
            
            updateTimerDisplay();
        }

        function clearTimer() {
            if (timerId) {
                clearTimeout(timerId);
                timerId = null;
            }
            timerEndTime = null;
            timerDisplay.textContent = '';
        }

        function updateTimerDisplay() {
            if (!timerEndTime) return;
            
            const remaining = timerEndTime - Date.now();
            if (remaining <= 0) {
                timerDisplay.textContent = '';
                return;
            }
            
            const minutes = Math.floor(remaining / 60000);
            const seconds = Math.floor((remaining % 60000) / 1000);
            timerDisplay.textContent = `将在 ${minutes}分${seconds}秒 后自动关闭`;
            
            requestAnimationFrame(updateTimerDisplay);
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' + s : s}`;
        }

        playBtn.addEventListener('click', togglePlay);
        document.getElementById('prevBtn').addEventListener('click', prevSong);
        document.getElementById('nextBtn').addEventListener('click', nextSong);

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progress.style.width = percent + '%';
                currentTimeEl.textContent = formatTime(audio.currentTime);
                durationEl.textContent = formatTime(audio.duration);
            }
        });

        audio.addEventListener('ended', () => {
            if (currentMode !== 'loop') {
                nextSong();
            }
        });

        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        });

        initPlaylist();
        loadSong(0);
    </script>
